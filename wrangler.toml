name = "pensa-gctu-cms"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# ── Durable Objects ──────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ── Default (local/dev) bindings ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "pensa-gctu-dev"
database_id = "caf376fe-5629-47b7-9556-08c35b01c728"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "8644070fa82140669a3139bbe09f1068"

# R2 is not yet enabled on this account. Enable R2 in the Cloudflare dashboard,
# then run: wrangler r2 bucket create pensa-gctu-media-dev (+ staging/production)
# and uncomment these blocks. MEDIA is only needed by the members media features.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "pensa-gctu-media-dev"

# Secrets (do NOT put values here): JWT_SECRET, TURNSTILE_SECRET
# Set with: wrangler secret put JWT_SECRET   (and per --env)

# ── Staging ──────────────────────────────────────────────────────────────────
[env.staging]
[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "pensa-gctu-staging"
database_id = "0d381e2a-6446-4ae1-802c-b8ce04aa90a4"
migrations_dir = "db/migrations"
[[env.staging.kv_namespaces]]
binding = "KV"
id = "43602ce0be734f08a3500b5476d6ba05"
# [[env.staging.r2_buckets]]
# binding = "MEDIA"
# bucket_name = "pensa-gctu-media-staging"

# ── Production ───────────────────────────────────────────────────────────────
[env.production]
[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
[[env.production.d1_databases]]
binding = "DB"
database_name = "pensa-gctu-production"
database_id = "e144abdb-9f94-4ad7-98f5-aeaf565ebd8b"
migrations_dir = "db/migrations"
[[env.production.kv_namespaces]]
binding = "KV"
id = "e90f8b91e7bd428daf35aff89839ee7a"
# [[env.production.r2_buckets]]
# binding = "MEDIA"
# bucket_name = "pensa-gctu-media-production"
