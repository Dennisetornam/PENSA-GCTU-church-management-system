name = "pensa-gctu-cms"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Admin SPA (built into dist/client by `npm run build:web`). The Worker runs
# first for API routes; everything else falls back to the SPA's index.html.
[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/healthz", "/register/options", "/register/draft", "/register/image", "/register/submit"]

# ── Durable Objects ──────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ── Default (local/dev) bindings ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "pensa-gctu-dev"
database_id = "caf376fe-5629-47b7-9556-08c35b01c728"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "8644070fa82140669a3139bbe09f1068"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "pensa-gctu-media-dev"

# Secrets (do NOT put values here): JWT_SECRET, TURNSTILE_SECRET
# Set with: wrangler secret put JWT_SECRET   (and per --env)

# ── Staging ──────────────────────────────────────────────────────────────────
[env.staging]
[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "pensa-gctu-staging"
database_id = "0d381e2a-6446-4ae1-802c-b8ce04aa90a4"
migrations_dir = "db/migrations"
[[env.staging.kv_namespaces]]
binding = "KV"
id = "43602ce0be734f08a3500b5476d6ba05"
[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "pensa-gctu-media-staging"

# ── Production ───────────────────────────────────────────────────────────────
[env.production]
[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
[[env.production.d1_databases]]
binding = "DB"
database_name = "pensa-gctu-production"
database_id = "e144abdb-9f94-4ad7-98f5-aeaf565ebd8b"
migrations_dir = "db/migrations"
[[env.production.kv_namespaces]]
binding = "KV"
id = "e90f8b91e7bd428daf35aff89839ee7a"
[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "pensa-gctu-media-production"
# NOTE: A custom domain (e.g. register.pensagctu.org) requires its DNS zone to be
# on THIS Cloudflare account. pensagctu.org is the university's zone and is not on
# this account, so it can't be provisioned here. To enable, either add the zone
# (or a delegated subdomain) to Cloudflare, or use a domain you control:
# [[env.production.routes]]
# pattern = "register.yourdomain.org"
# custom_domain = true
